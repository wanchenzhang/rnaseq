id: "computational-workflows-rnaseq-methods-description"
description: "Methods used by this course RNA-seq pipeline."
section_name: "RNA-seq methods"
section_href: "https://github.com/wanchenzhang/rnaseq"
plot_type: "html"
data: |
  <h4>Methods</h4>
  <p>This course pipeline was built with the nf-core template and modules. It is not an official nf-core pipeline. This run used computational-workflows/rnaseq v${workflow.manifest.version} ${doi_text} and Nextflow v${workflow.nextflow.version}.</p>
  <p>CAT_FASTQ merges sequencing runs from each sample. FastQC checks reads before and after trimming. The pipeline uses either Trim Galore or fastp, as selected in the run settings.</p>
  <p>STAR builds the reference index, aligns reads and sorts the genome BAM. Picard marks duplicates without removing them. Salmon uses the separate transcriptome BAM from STAR. It uses a supplied transcript FASTA, or one made by GFFREAD when no transcript FASTA is supplied.</p>
  <p>CUSTOM_TX2GENE makes the transcript-to-gene map. TXIMETA_TXIMPORT combines expression estimates across samples. MultiQC collects QC reports.</p>
  <h4>Run command</h4>
  <pre><code>${workflow.commandLine}</code></pre>
  <p>Settings from configuration files and profiles may not appear in this command. See the parameter summary and software versions for this run.</p>
  <h4>References</h4>
  <ul>
    <li>Di Tommaso et al. Nextflow (2017). <a href="https://doi.org/10.1038/nbt.3820">doi:10.1038/nbt.3820</a>.</li>
    <li>Ewels et al. nf-core (2020). <a href="https://doi.org/10.1038/s41587-020-0439-x">doi:10.1038/s41587-020-0439-x</a>.</li>
    <li><a href="https://github.com/wanchenzhang/rnaseq/blob/master/CITATIONS.md">References for all pipeline tools</a>.</li>
  </ul>
